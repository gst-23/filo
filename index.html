<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1118">
  <meta name="description" content="Filo: attività, scadenze, sotto-attività e allegati, senza distrazioni.">
  <title>Filo — Le tue attività</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles-v4.css">
  <script src="config.js"></script>
  <script type="module" src="app-v4.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="app-header">
      <a class="brand" href="./" aria-label="Filo, pagina iniziale">Filo<span>.</span></a>
      <button class="new-button" type="button" id="newTask" title="Nuova attività" aria-label="Nuova attività">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>

    <main>
      <div id="tasks" class="task-list" aria-label="Attività ordinate per data di scadenza" aria-live="polite"><div class="loading-state" role="status">Caricamento attività…</div></div>
    </main>

    <footer class="app-footer">
      <span id="storageStatus" role="status">Modalità locale: dati salvati in questo browser</span>
      <div class="footer-links">
        <button type="button" id="exportBackup">Esporta backup</button>
        <button type="button" id="importBackup">Importa backup</button>
        <button type="button" id="refreshTasks" title="Ricarica i dati dal cloud">Aggiorna</button>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
      </div>
    </footer>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>
</body>
</html>

<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Filo. Le tue attività e sotto-attività, senza distrazioni.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Filo">
  <title>Filo — Attività</title>
  <link rel="icon" href="favicon-v7.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-v7.png">
  <link rel="manifest" href="manifest-v7.webmanifest">
  <link rel="stylesheet" href="styles-v7.css">
  <script src="config.js"></script>
  <script type="module" src="app-v7.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="app-header">
      <a class="brand" href="./" aria-label="Filo, pagina iniziale">Filo<span>.</span></a>
      <button class="new-button" type="button" id="newTask" title="Nuova attività" aria-label="Nuova attività">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>
    <main>
      <div id="tasks" class="task-list" aria-label="Elenco unico delle attività ordinate per scadenza" aria-live="polite">
        <div class="loading-state" role="status">Caricamento attività…</div>
      </div>
    </main>
    <footer class="app-footer">
      <span id="storageStatus" role="status">Modalità locale: dati salvati in questo browser</span>
      <div class="footer-links">
        <button type="button" id="exportBackup">Esporta backup</button>
        <button type="button" id="importBackup">Importa backup</button>
        <button type="button" id="refreshTasks" title="Ricarica i dati dal cloud">Aggiorna</button>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
      </div>
    </footer>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
</body>
</html>
